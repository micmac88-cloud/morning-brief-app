/* Layout: a washed top band, a sticky tab row, then one panel of tinted section cards. Mobile first; wider screens below. */
:root{--bg:#FCFCFA;--wash:#F9F9F7;--card:#F4F2EC;--chip:#E8E5DC;--edge:#E2DFD6;--hair:#DCD8CD;
--ink:#2E2C27;--ink-soft:#55534C;--ink-grey:#8F8D84;
--clay:#C6613F;--clay-hover:#AE5133;--on-clay:#FCFCFB;--clay-text:#A64D2E;--clay-tint:#F7E8E0;--clay-edge:#EBCBBB;
--serif:"Fraunces",Georgia,serif;--sans:-apple-system,"Segoe UI",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1C1B18;--wash:#22211D;--card:#272621;--chip:#383730;--edge:#3A3934;--hair:#3A3833;
--ink:#ECEAE3;--ink-soft:#BEBCB2;--ink-grey:#7F7D74;
--clay:#D8734F;--clay-hover:#E58A68;--on-clay:#1C1B18;--clay-text:#EC9474;--clay-tint:#3A2921;--clay-edge:#5C3B2D;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--sans);padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:clip;overflow-wrap:break-word}
[hidden]{display:none!important}
.band{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:780px;margin:0 auto;min-width:0}
.top{background:var(--wash);padding-top:env(safe-area-inset-top,0px)}
.top .in{padding-block:24px 16px}
.date{color:var(--ink-soft);font-size:15px;font-weight:500;line-height:1.4;margin:0 0 6px}
h1{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.2;margin:0;text-wrap:balance;max-width:24ch}
/* Tab row */
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--wash);border-bottom:1px solid var(--edge)}
.tabbar::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:env(safe-area-inset-top,0px);background:var(--wash)}
nav{display:flex;gap:2px}
nav button{flex:1 1 0;min-width:0;min-height:58px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 2px 10px;font:500 15px/1.2 var(--sans);color:var(--ink-soft);background:none;border:0;cursor:pointer;white-space:nowrap}
nav button::after{content:"";position:absolute;left:12%;right:12%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:transparent}
nav button:hover{color:var(--ink)}
nav button[aria-selected="true"]{color:var(--ink);font-weight:700}
nav button[aria-selected="true"]::after{background:var(--clay)}
nav .c{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:20px;padding:0 7px;border-radius:999px;font:600 13px/1 var(--sans);font-variant-numeric:tabular-nums;background:var(--chip);color:var(--ink)}
nav button[aria-selected="true"] .c{background:var(--ink);color:var(--bg)}
nav .c.zero,nav button[aria-selected="true"] .c.zero{background:transparent;color:var(--ink-grey);font-weight:500}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
nav button:focus-visible{outline-offset:-3px;border-radius:8px}
/* Today: terrain and the three acts */
.panel .in{padding-block:20px 28px}
svg{display:block;width:100%;height:auto}
.acts{display:grid;margin:8px 0 24px}
.act{padding:14px 0;border-top:1px solid var(--hair);min-width:0}
.act:first-child{border-top:0;padding-top:4px}
.act b{display:block;font-size:14.5px;font-weight:700;color:var(--clay-text);letter-spacing:.01em;margin-bottom:4px;font-variant-numeric:tabular-nums}
.act p{margin:0;font-size:17px;line-height:1.55;max-width:65ch}
/* Section cards */
section{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:18px 16px 20px;min-width:0}
section+section{margin-top:16px}
h2{font-size:19px;line-height:1.3;font-weight:700;margin:0 0 14px;color:var(--ink)}
ol,ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
ol>li{display:grid;grid-template-columns:24px minmax(0,1fr);column-gap:8px}
ol>li+li{border-top:1px solid var(--hair);padding-top:14px}
.n{color:var(--ink-grey);font:600 15px/23px var(--sans);font-variant-numeric:tabular-nums}
.it{min-width:0}
.t{margin:0 0 4px;font-weight:600;font-size:17px;line-height:23px;color:var(--ink)}
.t a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--ink-grey);text-decoration-thickness:1px;text-underline-offset:3px}
.t a:hover{text-decoration-color:var(--clay)}
.s,.line{margin:0;color:var(--ink-soft);font-size:17px;line-height:1.55;max-width:65ch}
ul>li.line{position:relative;padding-left:18px}
ul>li.line::before{content:"";position:absolute;left:3px;top:calc(.775em - 3px);width:6px;height:6px;border-radius:50%;background:var(--ink-grey)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:12px;background:var(--clay);border:1px solid var(--clay);color:var(--on-clay);border-radius:10px;padding:0 18px;font:600 16px/1.2 var(--sans);text-decoration:none;cursor:pointer}
.btn:hover{background:var(--clay-hover);border-color:var(--clay-hover)}
/* Calendar */
.cal{display:grid}
.day{padding:14px 0;border-top:1px solid var(--hair);min-width:0}
.day:first-child{border-top:0;padding-top:0}
.day:last-child{padding-bottom:0}
.dl{font-size:15.5px;font-weight:700;line-height:1.3;color:var(--ink);margin:0 0 10px}
.evs{display:grid;gap:14px;min-width:0}
.ev{display:grid;grid-template-columns:92px minmax(0,1fr);column-gap:12px;align-items:start}
.ev .tm{font-size:15px;line-height:23px;font-weight:500;color:var(--ink-soft);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.evb{min-width:0}
.ev .nm{display:block;font-size:17px;line-height:23px;font-weight:500;color:var(--ink)}
.evm{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:4px}
.ev .tag{font-size:13px;font-weight:600;line-height:1.3;padding:3px 8px;border-radius:6px;background:var(--chip);color:var(--ink-soft);overflow-wrap:anywhere}
.ev .tag.clash{background:var(--clay-tint);color:var(--clay-text)}
.ev select{-webkit-appearance:none;appearance:none;margin:-5px -5px -5px auto;max-width:100%;min-height:44px;padding:0 30px 0 12px;font:16px/1.2 var(--sans);color:var(--ink-soft);border:5px solid transparent;border-radius:13px;background-color:var(--bg);background-clip:padding-box;box-shadow:inset 0 0 0 1px var(--edge);cursor:pointer;
background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-size:5px 5px,5px 5px;background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-repeat:no-repeat}
.ev select:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink-grey)}
/* Checklist, CiC slots, notes */
.check{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;font-size:17px;line-height:1.4;background:var(--bg);border:1px solid var(--edge);border-radius:12px;cursor:pointer}
.check input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--clay)}
.check.done{background:transparent}
.check.done span{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--ink-grey)}
.slot{display:grid;gap:8px;padding:16px 0;border-top:1px solid var(--hair)}
h2+.slot{border-top:0;padding-top:0}
.slot:last-child{padding-bottom:0}
.slot>b{font-size:15.5px;font-weight:700;line-height:1.3;color:var(--ink)}
.quiet{color:var(--ink-soft);font-size:16px;margin:0}
.note{color:var(--ink-soft);font-size:14.5px;margin:16px 0 0;line-height:1.5;max-width:65ch}
.rule{margin-top:16px;padding:14px;background:var(--clay-tint);border:1px solid var(--clay-edge);border-radius:12px;display:grid;gap:10px}
.rule .s{color:var(--ink)}
.rule code{display:block;font:15px/1.45 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--clay-edge);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
.rule .row{display:flex;flex-wrap:wrap;gap:8px}
.ghost{display:inline-flex;align-items:center;justify-content:center;min-height:44px;font:500 15px/1.2 var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--edge);border-radius:10px;padding:0 16px;cursor:pointer;text-decoration:none}
.ghost:hover{border-color:var(--ink-grey)}
footer .in{padding-block:4px 32px;display:flex;flex-wrap:wrap;gap:10px}
footer button{min-height:44px;padding:0 18px;font:500 15px/1.2 var(--sans);color:var(--ink-soft);background:none;border:1px solid var(--edge);border-radius:10px;cursor:pointer}
footer button:hover{color:var(--ink);border-color:var(--ink-grey)}
/* Lock screen */
.lock{min-height:100vh;min-height:100dvh}
.lock .in{padding-block:clamp(48px,12vh,112px) 48px;max-width:420px}
.lock h1{font-size:34px;margin-bottom:10px}
.lock p{color:var(--ink-soft);margin:0 0 22px;font-size:17px;line-height:1.5}
.lock form{display:grid;gap:14px}
.lock input[type=password]{font:17px var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--edge);border-radius:10px;padding:0 14px;min-height:50px;width:100%}
.lock label{display:flex;gap:10px;align-items:center;min-height:44px;color:var(--ink-soft);font-size:16px;cursor:pointer}
.lock label input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--clay)}
.lock .btn{margin:0;min-height:50px;width:100%;font-size:17px}
.lock .err,.err{color:var(--clay-text);font-size:15px;line-height:1.4;min-height:1.4em;margin:0}
@media (max-width:359px){nav button{font-size:14px}}
@media (min-width:640px){
.top .in{padding-block:40px 20px}
h1{font-size:38px;line-height:1.15}
nav{gap:4px;margin-inline:-14px}
nav button{flex:0 0 auto;flex-direction:row;gap:8px;min-height:52px;padding:0 14px}
nav button::after{left:14px;right:14px}
.panel .in{padding-block:32px 44px}
.acts{grid-template-columns:repeat(3,minmax(0,1fr));margin:12px 0 32px}
.act{padding:2px 20px 0;border-top:0;border-left:1px solid var(--hair)}
.act:first-child{border-left:0;padding-left:0;padding-top:2px}
section{padding:24px 28px 26px;border-radius:18px}
section+section{margin-top:20px}
.day{display:grid;grid-template-columns:104px minmax(0,1fr);gap:16px}
.dl{margin:0;line-height:23px}
.ev{grid-template-columns:120px minmax(0,1fr);column-gap:14px}
.slot{grid-template-columns:140px minmax(0,1fr);gap:16px}
.slot>b{line-height:23px}
}
</style>
</head>
<body>
<div class="band top lock" id="lock"><div class="in">
  <h1>Morning</h1>
  <p id="lockmsg">Enter your password to open today's brief.</p>
  <form id="lockform" autocomplete="on">
    <input type="text" name="username" value="morning" autocomplete="username" hidden>
    <input type="password" id="pw" name="password" autocomplete="current-password" aria-label="Password" required>
    <label><input type="checkbox" id="remember" checked> Remember on this device</label>
    <button class="btn" type="submit">Open</button>
    <p class="err" id="err" role="alert"></p>
  </form>
</div></div>

<div id="app" hidden>
  <div class="band top"><div class="in">
    <p class="date" id="dayline"></p>
    <h1 id="headline"></h1>
  </div></div>
  <div class="band tabbar"><div class="in"><nav role="tablist" aria-label="Brief sections" id="tabs"></nav></div></div>
  <div class="band panel"><div class="in" id="panel" role="tabpanel"></div></div>
  <footer class="band"><div class="in"><button type="button" id="refresh">Refresh</button><button type="button" id="lockbtn">Lock</button></div></footer>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(_){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(_){}},del(k){try{localStorage.removeItem(k)}catch(_){}}};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=u=>btoa(String.fromCharCode(...new Uint8Array(u)));

/* ---------- decryption: PBKDF2-SHA256 -> AES-256-GCM ---------- */
async function fetchBox(){
  const r=await fetch('brief.enc.json?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('fetch');return r.json();
}
async function deriveKey(pw,box){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:b64d(box.salt),iterations:box.iter},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function open(box,key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(box.iv)},key,b64d(box.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
// The remembered key is tied to the salt, which changes only when the password changes.
async function savedKey(box){
  const raw=store.get('mb-key'),salt=store.get('mb-salt');
  if(!raw||salt!==box.salt)return null;
  return crypto.subtle.importKey('raw',b64d(raw),{name:'AES-GCM'},true,['decrypt']);
}

let box=null;
async function boot(){
  try{box=await fetchBox()}catch(_){showLock('The brief could not be loaded. Check your connection and refresh.');return}
  try{const k=await savedKey(box);if(k){start(await open(box,k));return}}catch(_){store.del('mb-key')}
  showLock();
}
function showLock(msg){$('app').hidden=true;$('lock').hidden=false;if(msg)$('lockmsg').textContent=msg;$('pw').focus()}
$('lockform').addEventListener('submit',async ev=>{
  ev.preventDefault();$('err').textContent='';
  if(!box){try{box=await fetchBox()}catch(_){$('err').textContent='No connection.';return}}
  try{
    const key=await deriveKey($('pw').value,box);const data=await open(box,key);
    if($('remember').checked){store.set('mb-key',b64e(await crypto.subtle.exportKey('raw',key)));store.set('mb-salt',box.salt)}
    $('pw').value='';start(data);
  }catch(_){$('err').textContent='That password did not open the brief.'}
});
$('lockbtn').addEventListener('click',()=>{store.del('mb-key');store.del('mb-salt');location.reload()});
$('refresh').addEventListener('click',()=>location.reload());

/* ---------- the brief ---------- */
const GROUPS=['work','home','activity','other'];
const LABEL={today:'Today',work:'Work',home:'Home',activity:'Activity',other:'Other'};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,120)||'x';
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
const ask=seed=>'https://claude.ai/new?q='+encodeURIComponent(seed)+'&surface=cowork&composer=mini';
const SVGNS='http://www.w3.org/2000/svg';
const sv=(tag,attrs)=>{const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e};

let B=null,rules={},local={},ticks={},cur='today',pending=null;

function start(data){
  B=data;rules=B.rules||{};
  try{local=JSON.parse(store.get('mb-rules')||'{}')||{}}catch(_){local={}}
  try{ticks=JSON.parse(store.get('mb-ticks-'+B.date)||'{}')||{}}catch(_){ticks={}}
  const h=location.hash.slice(1),s=store.get('mb-tab');
  cur=LABEL[h]?h:(LABEL[s]?s:'today');
  $('dayline').textContent=B.dayLine;$('headline').textContent=B.headline;
  $('lock').hidden=true;$('app').hidden=false;render();
}
const groupOf=ev=>local[slug(ev.title)]||rules[slug(ev.title)]||ev.g;

function terrain(){
  const T=B.terrain,X=h=>20+(h-8)*800/15.5,base=140;
  const bumps=T.bumps.map(([c,a,w])=>[X(c),a,w]);
  const Y=x=>base-bumps.reduce((s,[c,a,w])=>s+a*Math.exp(-(((x-c)/w)**2)/2),0);
  const svg=sv('svg',{viewBox:'0 0 840 170',role:'img','aria-label':'The day drawn as terrain: height shows how full each hour is'});
  const pts=[];for(let x=10;x<=830;x+=4)pts.push(x+','+Y(x).toFixed(1));
  if(T.overlap){const [a,b]=T.overlap.map(X),sx=(a+b)/2,sy=Y(sx)+22;
    svg.append(sv('path',{d:`M${(sx-20).toFixed(1)},${sy.toFixed(1)} q5,-6 10,0 t10,0 t10,0 t10,0`,fill:'none',stroke:'var(--clay)','stroke-width':2.2,'stroke-linecap':'round'}))}
  svg.append(sv('polyline',{points:pts.join(' '),fill:'none',stroke:'var(--ink)','stroke-width':2.4,'stroke-linejoin':'round','stroke-linecap':'round'}));
  T.dots.forEach(([h,r])=>svg.append(sv('circle',{cx:X(h).toFixed(1),cy:Y(X(h)).toFixed(1),r,fill:'var(--ink)'})));
  if(T.overlap)T.overlap.map(X).forEach(x=>svg.append(sv('circle',{cx:x.toFixed(1),cy:Y(x).toFixed(1),r:8,fill:'var(--bg)',stroke:'var(--ink)','stroke-width':2})));
  if(T.moon)svg.append(sv('path',{d:'M790,26 a14,14 0 1,0 14,20 a11,11 0 1,1 -14,-20z',fill:'none',stroke:'var(--ink)','stroke-width':2}));
  return svg;
}
function item(list,i,it){
  const li=el('li');li.append(el('span','n',String(i+1)));
  const d=el('div','it'),p=el('p','t');
  if(it.url&&/^https:\/\//.test(it.url)){const a=el('a',null,it.title);a.href=it.url;a.target='_blank';a.rel='noopener noreferrer';p.append(a)}else p.textContent=it.title;
  d.append(p,el('p','s',it.text));
  if(it.button){const b=el('a','btn',it.button.label);b.href=ask(it.button.seed);b.target='_blank';b.rel='noopener noreferrer';d.append(b)}
  li.append(d);list.append(li);
}
function listSec(title,items,empty){
  const s=el('section');s.append(el('h2',null,title));
  if(!items||!items.length){s.append(el('p','quiet',empty||'Nothing here today.'));return s}
  const ol=el('ol');items.forEach((it,i)=>item(ol,i,it));s.append(ol);return s;
}
function lineSec(title,text){const s=el('section');s.append(el('h2',null,title),el('p','line',text));return s}
function calSec(g){
  const s=el('section');s.append(el('h2',null,'Calendar · next 8 days'));
  const evs=B.calendar.filter(e=>groupOf(e)===g);
  if(!evs.length)s.append(el('p','quiet','No '+LABEL[g].toLowerCase()+' events in the next 8 days.'));
  else{
    const wrap=el('div','cal');
    [...new Set(evs.map(e=>e.d))].forEach(d=>{const row=el('div','day');row.append(el('div','dl',d));const box=el('div','evs');
      evs.filter(e=>e.d===d).forEach(e=>{const r=el('div','ev'),body=el('div','evb'),meta=el('div','evm');
        r.append(el('span','tm',e.t),body);body.append(el('span','nm',e.title),meta);
        if(e.flag==='clash')meta.append(el('span','tag clash','clash'));
        if(e.flag==='late')meta.append(el('span','tag','late'));
        if(e.merged)meta.append(el('span','tag',e.merged));
        const sel=el('select');sel.setAttribute('aria-label','Move '+e.title+' to another group');
        const o0=el('option',null,'Move to…');o0.value='';sel.append(o0);
        GROUPS.filter(x=>x!==g).forEach(x=>{const o=el('option',null,LABEL[x]);o.value=x;sel.append(o)});
        sel.addEventListener('change',()=>{if(sel.value)move(e,sel.value)});meta.append(sel);box.append(r)});
      row.append(box);wrap.append(row)});
    s.append(wrap);
  }
  if(pending&&pending.from===g)s.append(ruleBox());
  s.append(el('p','note','Moving an event changes it on this phone straight away. To make it stick for every future brief, send the rule to the bot.'));
  return s;
}
function ruleBox(){
  const text=pending.title+' → '+LABEL[pending.to];
  const box=el('div','rule');box.append(el('p','s','Moved. To keep this for future briefs, send this to the bot:'),el('code',null,text));
  const row=el('div','row');
  const copy=el('button','ghost','Copy');copy.type='button';
  copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(text);copy.textContent='Copied'}catch(_){copy.textContent='Select the text above'}});
  row.append(copy);
  if(B.bot){const a=el('a','ghost','Open Telegram');a.href='https://t.me/'+encodeURIComponent(B.bot);a.target='_blank';a.rel='noopener noreferrer';row.append(a)}
  box.append(row);return box;
}
function move(e,g){
  const from=groupOf(e);local[slug(e.title)]=g;store.set('mb-rules',JSON.stringify(local));
  pending={title:e.title,to:g,from};render();
}
function counts(){
  const W=B.work,first=B.calendar.length?B.calendar[0].d:null;
  return{today:B.clashes.length+B.prep.filter(p=>p.url||p.button).length,
    work:W.needsReply.length+W.waiting.length,home:B.home.reminders.length,
    activity:B.movement.today.filter(m=>!ticks[m.key]).length,
    other:B.calendar.filter(e=>groupOf(e)==='other'&&e.d===first).length};
}
function tabs(){
  const nav=$('tabs');nav.textContent='';const c=counts();
  Object.keys(LABEL).forEach(k=>{const b=el('button');b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',String(k===cur));b.id='tab-'+k;
    b.append(document.createTextNode(LABEL[k]),el('span','c'+(c[k]?'':' zero'),String(c[k])));
    b.addEventListener('click',()=>{cur=k;pending=null;store.set('mb-tab',k);render();
      const gap=$('panel').parentNode.getBoundingClientRect().top-nav.parentNode.parentNode.getBoundingClientRect().bottom;
      if(gap<0)window.scrollBy(0,gap)});nav.append(b)});
}
function render(){
  tabs();const P=$('panel');P.textContent='';P.setAttribute('aria-labelledby','tab-'+cur);
  if(cur==='today'){
    P.append(terrain());
    const acts=el('div','acts');B.acts.forEach(a=>{const d=el('div','act');d.append(el('b',null,a.time),el('p',null,a.text));acts.append(d)});P.append(acts);
    P.append(listSec('Clashes',B.clashes,'No clashes.'),listSec('Prep',B.prep),lineSec('Week ahead',B.weekAhead));
  }
  if(cur==='work'){const W=B.work;
    P.append(listSec('Needs your reply',W.needsReply,'Nobody is waiting on you.'),listSec('Waiting on others',W.waiting,'Nothing outstanding.'),lineSec('Teams',W.teams),listSec('Deadlines · next two weeks',W.deadlines));
    const t=el('section');t.append(el('h2',null,'Teaching this week'));const ul=el('ul');ul.style.gap='6px';W.teaching.sessions.forEach(x=>ul.append(el('li','line',x)));t.append(ul);
    if(W.teaching.notes.length){const ol=el('ol');ol.style.marginTop='18px';W.teaching.notes.forEach((it,i)=>item(ol,i,it));t.append(ol)}P.append(t);
    P.append(listSec('Research · feedback system with Nicholas',W.research));
    const c=el('section');c.append(el('h2',null,'CiC'));Object.entries(W.cic).forEach(([k,v])=>{const r=el('div','slot');r.append(el('b',null,k));const bx=el('div','it');
      if(!v.length)bx.append(el('p','quiet','Nothing new.'));else{const o=el('ol');v.forEach((it,i)=>item(o,i,it));bx.append(o)}r.append(bx);c.append(r)});P.append(c);
    P.append(listSec('Field news',W.field),calSec('work'));
  }
  if(cur==='home')P.append(lineSec('Gmail',B.home.gmail),listSec('Personal reminders',B.home.reminders),calSec('home'));
  if(cur==='activity'){
    const s=el('section');s.append(el('h2',null,'Movement today'));const ul=el('ul');ul.style.gap='12px';
    B.movement.today.forEach(m=>{const lab=el('label','check'+(ticks[m.key]?' done':''));const cb=el('input');cb.type='checkbox';cb.checked=!!ticks[m.key];
      cb.addEventListener('change',()=>{ticks[m.key]=cb.checked;store.set('mb-ticks-'+B.date,JSON.stringify(ticks));render()});
      lab.append(cb,el('span',null,m.title+' · '+m.time));const li=el('li');li.append(lab);ul.append(li)});
    const nx=el('p','line',B.movement.next);nx.style.marginTop='14px';s.append(ul,nx);P.append(s,calSec('activity'));
  }
  if(cur==='other')P.append(calSec('other'));
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
})();
</script>
</body>
</html>
